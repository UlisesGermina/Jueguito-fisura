<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <title>Fideos Voladores - Juegos de Theo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; height: 100dvh;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%; height: 100%;
      max-width: 500px;
      max-height: 100vh; max-height: 100dvh;
      padding: 4px;
      gap: 2px;
    }
    #hud {
      display: flex;
      justify-content: space-between;
      width: 100%;
      color: #fff;
      font-size: 9px;
      padding: 2px 6px;
      flex-shrink: 0;
    }
    .hv { color: #ffff00; }
    canvas {
      border: 2px solid #4488cc;
      border-radius: 8px;
      background: #000;
      display: block;
      width: 100%;
      flex: 1;
      min-height: 0;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      color: #fff;
      z-index: 10;
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    #overlay.hidden { display: none; }
    #overlay h1 { font-size: 20px; color: #ffff00; margin-bottom: 6px; text-shadow: 0 0 15px rgba(255,255,0,0.4); }
    #overlay p { font-size: 9px; margin: 4px 0; color: #ccc; line-height: 1.6; }
    #overlay button {
      margin-top: 16px;
      padding: 12px 32px;
      font-size: 12px;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      background: #ffff00;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    #overlay button:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(255,255,0,0.5); }
    #cbox { position: relative; width: 100%; flex: 1; min-height: 0; }
    .back-link {
      position: fixed;
      top: 8px; left: 8px;
      color: #888;
      font-size: 8px;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      text-decoration: none;
      z-index: 50;
      padding: 6px;
    }
    .back-link:hover { color: #ffff00; }
  </style>
</head>
<body>
  <a href="../" class="back-link">← VOLVER</a>
  <div id="wrap">
    <div id="hud">
      <span>Puntos: <span class="hv" id="hud-score">0</span></span>
      <span>Nivel: <span class="hv" id="hud-level">1</span></span>
      <span>Vidas: <span class="hv" id="hud-lives">♥♥♥</span></span>
    </div>
    <div id="cbox">
      <canvas id="c"></canvas>
      <div id="overlay">
        <h1>FIDEOS VOLADORES</h1>
        <p style="font-size:11px; color:#ffff00; margin-bottom:6px">¡Atrapá los ingredientes, Chef Theo!</p>
        <p>Tocá o presioná ← → para cambiar de dirección</p>
        <p style="color:#ffaa00; font-size:7px">¡El chef no para nunca!</p>
        <p>Agarrá 🍅🧀🍳</p>
        <p style="color:#ff4444">¡Esquivá 🔪👢🪨!</p>
        <p style="color:#ffdd00">Bonus: 🍝 Espagueti Dorado</p>
        <button id="play-btn">Jugar</button>
      </div>
    </div>
  </div>

  <script>
    const GF = '"Press Start 2P","Courier New",monospace';
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const hudScore = document.getElementById('hud-score');
    const hudLevel = document.getElementById('hud-level');
    const hudLives = document.getElementById('hud-lives');

    let W, H, dpr;
    function resize() {
      const box = canvas.getBoundingClientRect();
      dpr = window.devicePixelRatio || 1;
      W = Math.floor(box.width);
      H = Math.floor(box.height);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // --- Audio ---
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playDing() {
      try {
        const a = getAudio(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(880, t);
        o.frequency.setValueAtTime(1100, t + 0.05);
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + 0.2);
      } catch (e) {}
    }

    function playBoing() {
      try {
        const a = getAudio(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'square'; o.frequency.setValueAtTime(200, t);
        o.frequency.exponentialRampToValueAtTime(80, t + 0.15);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + 0.2);
      } catch (e) {}
    }

    function playTing() {
      try {
        const a = getAudio(), t = a.currentTime;
        const o = a.createOscillator(), g = a.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(1200, t);
        o.frequency.setValueAtTime(1500, t + 0.06);
        o.frequency.setValueAtTime(1800, t + 0.12);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + 0.3);
      } catch (e) {}
    }

    // --- Items ---
    const INGREDIENTS = [
      { emoji: '🍅', pts: 10, color: '#ff4444', name: 'Tomate' },
      { emoji: '🧀', pts: 15, color: '#ffcc00', name: 'Queso' },
      { emoji: '🍳', pts: 10, color: '#ffeeaa', name: 'Huevo' },
    ];
    const BAD_ITEMS = [
      { emoji: '🔪', color: '#cccccc', name: 'Cuchillo' },
      { emoji: '👢', color: '#884422', name: 'Bota' },
      { emoji: '🪨', color: '#888888', name: 'Piedra' },
    ];
    const BONUS = { emoji: '🍝', pts: 50, color: '#ffdd00', name: 'Espagueti Dorado' };

    let state, score, lives, level, items, particles, player,
        spawnTimer, spawnRate, fallSpeed, frameCount, combo,
        shakeTimer, flashTimer, displayScore, clouds;

    function getHiScore() {
      try { return parseInt(localStorage.getItem('fideos-hi') || '0', 10); } catch (e) { return 0; }
    }
    function saveHiScore(s) {
      try { const hi = getHiScore(); if (s > hi) localStorage.setItem('fideos-hi', s.toString()); } catch (e) {}
    }

    function initClouds() {
      clouds = [];
      for (let i = 0; i < 5; i++) {
        clouds.push({ x: Math.random() * W, y: 30 + Math.random() * (H * 0.4), w: 40 + Math.random() * 60, speed: 0.2 + Math.random() * 0.3 });
      }
    }

    function init() {
      state = 'playing';
      score = 0; displayScore = 0;
      lives = 3;
      level = 1;
      items = [];
      particles = [];
      spawnTimer = 0;
      spawnRate = 50;
      fallSpeed = 2;
      frameCount = 0;
      combo = 0;
      shakeTimer = 0;
      flashTimer = 0;
      player = { x: W / 2, w: 36, h: 52, dir: 1, walkFrame: 0 };
      initClouds();
      overlay.classList.add('hidden');
      updateHUD();
    }

    function updateHUD() {
      hudScore.textContent = displayScore;
      hudLevel.textContent = level;
      hudLives.textContent = '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(Math.max(0, 3 - lives));
    }

    function getTheme() {
      if (level <= 3) return 'kitchen';
      if (level <= 6) return 'sky';
      return 'space';
    }

    function spawnItem() {
      const badChance = Math.min(0.28, 0.10 + level * 0.02);
      const bonusChance = 0.04;
      const isBad = Math.random() < badChance;
      const isBonus = !isBad && Math.random() < bonusChance;
      const size = 26 + Math.random() * 8;
      const margin = size;
      items.push({
        x: margin + Math.random() * (W - margin * 2),
        y: -size,
        size,
        vy: fallSpeed + Math.random() * 1.5,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.03,
        type: isBad ? 'bad' : isBonus ? 'bonus' : 'ingredient',
        data: isBad ? BAD_ITEMS[Math.floor(Math.random() * BAD_ITEMS.length)]
             : isBonus ? BONUS
             : INGREDIENTS[Math.floor(Math.random() * INGREDIENTS.length)],
        rotation: 0,
        rotSpeed: (Math.random() - 0.5) * 0.06,
      });
    }

    function emitParticles(x, y, color, count) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: (Math.random() - 0.5) * 8,
          vy: -Math.random() * 6 - 2,
          life: 20 + Math.random() * 15,
          maxLife: 35,
          size: 2 + Math.random() * 3,
          color,
        });
      }
    }

    function addTextParticle(x, y, text, color, size) {
      particles.push({
        x, y, vx: 0, vy: -1.5,
        life: 35, maxLife: 35,
        size: 0, color,
        text, textSize: size || 10,
      });
    }

    function update() {
      if (state !== 'playing') return;
      frameCount++;
      player.walkFrame += 0.15;

      if (displayScore < score) {
        displayScore += Math.max(1, Math.ceil((score - displayScore) * 0.15));
        if (displayScore > score) displayScore = score;
      }

      const newLevel = Math.floor(score / 150) + 1;
      if (newLevel > level) {
        level = newLevel;
        fallSpeed = 2 + level * 0.4;
        spawnRate = Math.max(18, 50 - level * 3);
      }

      spawnTimer++;
      if (spawnTimer >= spawnRate) { spawnTimer = 0; spawnItem(); }

      // Clouds
      if (clouds) {
        for (const c of clouds) {
          c.x += c.speed;
          if (c.x > W + c.w) c.x = -c.w;
        }
      }

      const playerY = H - player.h - 8;
      const pL = player.x - player.w / 2;
      const pR = player.x + player.w / 2;

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.y += it.vy;
        it.wobble += it.wobbleSpeed;
        it.x += Math.sin(it.wobble) * 0.5;
        it.rotation += it.rotSpeed;

        if (it.y > H + it.size) {
          if (it.type !== 'bad') combo = 0;
          items[i] = items[items.length - 1]; items.pop();
          continue;
        }

        const ir = it.size * 0.4;
        if (it.y + ir > playerY && it.y - ir < playerY + player.h &&
            it.x + ir > pL && it.x - ir < pR) {
          if (it.type === 'bad') {
            lives--;
            shakeTimer = 12;
            flashTimer = 20;
            combo = 0;
            emitParticles(it.x, it.y, '#ff4400', 15);
            playBoing();
            if (navigator.vibrate) navigator.vibrate(80);
            if (lives <= 0) { endGame(); return; }
          } else {
            combo++;
            const mult = Math.min(combo, 5);
            const pts = it.data.pts * mult;
            score += pts;
            emitParticles(it.x, it.y, it.data.color, 10);
            const label = mult > 1 ? `+${pts} x${mult}` : `+${pts}`;
            addTextParticle(it.x, it.y - 15, label, it.data.color, mult > 1 ? 12 : 10);
            if (it.type === 'bonus') {
              playTing();
              addTextParticle(it.x, it.y - 35, '🍝 BONUS!', '#ffdd00', 14);
            } else {
              playDing();
            }
          }
          items[i] = items[items.length - 1]; items.pop();
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy;
        if (!p.text) { p.vx *= 0.95; p.vy += 0.15; }
        p.life--;
        if (p.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); }
      }

      if (shakeTimer > 0) shakeTimer--;
      if (flashTimer > 0) flashTimer--;
      updateHUD();
    }

    // --- Draw Theo Chef (pixel art) ---
    function drawTheo(cx, cy, dir, walkPhase) {
      ctx.save();
      ctx.translate(cx, cy);
      if (dir < 0) ctx.scale(-1, 1);
      const s = 2;

      // Brown shoes
      const legOffset = Math.sin(walkPhase) * 3;
      ctx.fillStyle = '#5c3a1e';
      ctx.fillRect(-7 * s, 22 * s + legOffset, 5 * s, 4 * s);
      ctx.fillRect(2 * s, 22 * s - legOffset, 5 * s, 4 * s);

      // Blue pants
      ctx.fillStyle = '#3355aa';
      ctx.fillRect(-7 * s, 16 * s, 6 * s, 7 * s + legOffset);
      ctx.fillRect(1 * s, 16 * s, 6 * s, 7 * s - legOffset);

      // White shirt (arms)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-10 * s, 4 * s, 4 * s, 10 * s);
      ctx.fillRect(6 * s, 4 * s, 4 * s, 10 * s);

      // Orange apron
      ctx.fillStyle = '#ee8822';
      ctx.fillRect(-6 * s, 3 * s, 12 * s, 14 * s);

      // Apron strap
      ctx.fillStyle = '#dd7711';
      ctx.fillRect(-2 * s, 0 * s, 1 * s, 4 * s);
      ctx.fillRect(1 * s, 0 * s, 1 * s, 4 * s);

      // Skin (face)
      ctx.fillStyle = '#f5c99a';
      ctx.fillRect(-5 * s, -6 * s, 10 * s, 8 * s);

      // Brown hair
      ctx.fillStyle = '#5c3a1e';
      ctx.fillRect(-6 * s, -9 * s, 12 * s, 5 * s);
      ctx.fillRect(-6 * s, -6 * s, 2 * s, 3 * s);

      // Eyes
      ctx.fillStyle = '#000';
      ctx.fillRect(-3 * s, -4 * s, 2 * s, 2 * s);
      ctx.fillRect(1 * s, -4 * s, 2 * s, 2 * s);

      // Mouth
      ctx.fillStyle = '#cc4444';
      ctx.fillRect(-1 * s, -1 * s, 3 * s, 1 * s);

      // Blush
      ctx.fillStyle = 'rgba(255,100,100,0.4)';
      ctx.fillRect(-5 * s, -2 * s, 2 * s, 1 * s);
      ctx.fillRect(3 * s, -2 * s, 2 * s, 1 * s);

      // Chef hat
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6 * s, -13 * s, 12 * s, 5 * s);
      // Hat top puff
      ctx.fillRect(-4 * s, -17 * s, 9 * s, 5 * s);
      ctx.fillRect(-2 * s, -19 * s, 6 * s, 3 * s);
      // Hat outline
      ctx.fillStyle = '#3a2010';
      ctx.fillRect(-4 * s, -17 * s, 1 * s, 1 * s);
      ctx.fillRect(4 * s, -17 * s, 1 * s, 1 * s);
      ctx.fillRect(-2 * s, -19 * s, 1 * s, 1 * s);
      ctx.fillRect(3 * s, -19 * s, 1 * s, 1 * s);

      // Wooden spoon in hand
      ctx.fillStyle = '#aa7733';
      ctx.fillRect(8 * s, 2 * s, 2 * s, 10 * s);
      ctx.fillStyle = '#cc9944';
      ctx.fillRect(7 * s, -1 * s, 4 * s, 4 * s);
      ctx.fillRect(8 * s, -2 * s, 2 * s, 1 * s);

      ctx.restore();
    }

    // --- Backgrounds ---
    function drawKitchenBg() {
      // Warm yellow wall
      ctx.fillStyle = '#c8a050';
      ctx.fillRect(0, 0, W, H);
      // Floor
      ctx.fillStyle = '#8b6530';
      ctx.fillRect(0, H * 0.75, W, H * 0.25);
      // Floor tiles
      ctx.fillStyle = '#9a7240';
      for (let x = 0; x < W; x += 40) {
        ctx.fillRect(x, H * 0.75, 38, H * 0.25);
      }
      // Shelf
      ctx.fillStyle = '#6b4520';
      ctx.fillRect(10, H * 0.15, W - 20, 6);
      ctx.fillRect(10, H * 0.35, W - 20, 6);
      // Pots on shelf
      ctx.fillStyle = '#888';
      ctx.fillRect(30, H * 0.15 - 15, 14, 15);
      ctx.fillRect(60, H * 0.15 - 20, 18, 20);
      ctx.fillRect(W - 60, H * 0.35 - 12, 12, 12);
    }

    function drawSkyBg() {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, '#4488dd');
      grad.addColorStop(0.7, '#88bbee');
      grad.addColorStop(1, '#aaddff');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
      // Clouds
      if (clouds) {
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        for (const c of clouds) {
          ctx.beginPath();
          ctx.ellipse(c.x, c.y, c.w * 0.5, 12, 0, 0, Math.PI * 2);
          ctx.ellipse(c.x - c.w * 0.2, c.y - 5, c.w * 0.3, 10, 0, 0, Math.PI * 2);
          ctx.ellipse(c.x + c.w * 0.2, c.y - 3, c.w * 0.35, 11, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawSpaceBg() {
      ctx.fillStyle = '#0a0a22';
      ctx.fillRect(0, 0, W, H);
      // Stars
      ctx.fillStyle = '#fff';
      for (let i = 0; i < 40; i++) {
        const sx = (i * 137.5 + frameCount * 0.2) % W;
        const sy = (i * 97.3) % H;
        const sz = 0.5 + (i % 3);
        const twinkle = 0.4 + Math.sin(frameCount * 0.05 + i) * 0.4;
        ctx.globalAlpha = twinkle;
        ctx.fillRect(sx, sy, sz, sz);
      }
      ctx.globalAlpha = 1;
      // Planets
      const planetColors = ['#4488bb', '#44bb66', '#bb8844'];
      for (let i = 0; i < 3; i++) {
        const px = (i * 167 + 40) % W;
        const py = 30 + (i * 89) % (H * 0.4);
        ctx.fillStyle = planetColors[i];
        ctx.globalAlpha = 0.5;
        ctx.beginPath();
        ctx.arc(px, py, 12 + i * 5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    function draw() {
      ctx.save();
      if (shakeTimer > 0) {
        ctx.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
      }

      // Background based on level theme
      const theme = getTheme();
      if (theme === 'kitchen') drawKitchenBg();
      else if (theme === 'sky') drawSkyBg();
      else drawSpaceBg();

      // Items
      items.forEach(it => {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.rotate(it.rotation);

        let sz = it.size;
        if (it.type === 'bonus') {
          sz *= 1 + Math.sin(frameCount * 0.15) * 0.12;
          // Golden glow
          ctx.shadowColor = '#ffdd00';
          ctx.shadowBlur = 12;
        } else if (it.type === 'bad') {
          sz *= 1 + Math.sin(frameCount * 0.2) * 0.06;
        }

        ctx.font = `${Math.floor(sz)}px serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.data.emoji, 0, 0);
        ctx.shadowBlur = 0;

        ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        if (p.text) {
          const scale = 0.7 + alpha * 0.5;
          ctx.font = `bold ${Math.floor(p.textSize * scale)}px ${GF}`;
          ctx.textAlign = 'center';
          ctx.fillStyle = p.color;
          ctx.fillText(p.text, p.x, p.y);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
          ctx.fill();
        }
      });
      ctx.globalAlpha = 1;

      // Draw Theo Chef
      const theoY = H - 8;
      drawTheo(player.x, theoY, player.dir, player.walkFrame);

      // Combo indicator
      if (combo >= 3) {
        const pulse = 1 + Math.sin(frameCount * 0.15) * 0.1;
        ctx.save();
        ctx.globalAlpha = 0.9;
        ctx.font = `bold ${Math.floor(13 * pulse)}px ${GF}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = combo >= 5 ? '#ff4400' : '#ffaa00';
        ctx.fillText(`x${Math.min(combo, 5)} COMBO`, W / 2, 25);
        ctx.restore();
      }

      // Flash on hit
      if (flashTimer > 0 && Math.floor(flashTimer / 3) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,0,0,0.15)';
        ctx.fillRect(-10, -10, W + 20, H + 20);
      }

      // Theme transition banner
      if (level === 4 && frameCount % 120 < 80) {
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.font = `bold 12px ${GF}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.fillText('☁️ CIELO ☁️', W / 2, H / 2);
        ctx.restore();
      }
      if (level === 7 && frameCount % 120 < 80) {
        ctx.save();
        ctx.globalAlpha = 0.8;
        ctx.font = `bold 12px ${GF}`;
        ctx.textAlign = 'center';
        ctx.fillStyle = '#aaccff';
        ctx.fillText('🚀 ESPACIO 🚀', W / 2, H / 2);
        ctx.restore();
      }

      ctx.restore();
    }

    const deathMsgs = [
      'Casi. CASI. Dale de nuevo, Chef.',
      'Los grandes chefs siempre queman algo primero.',
      'Eso fue nada. Sos capaz de mucho más.',
      '¿Eso es todo? Sé que podés más.',
      'Seguí cocinando. Punto.',
      'Nadie llegó lejos sin quemar mil platos primero.',
    ];
    const hiMsgs = [
      '¡RÉCORD! Sabía que ibas a romperla, Chef.',
      '¡NUEVO RÉCORD! No me sorprende para nada.',
      '¡RÉCORD! Eso es todo tuyo, Theo.',
      '¡RÉCORD SUPERADO! Así se cocina.',
    ];

    function endGame() {
      state = 'gameover';
      saveHiScore(score);
      const hi = getHiScore();
      const isHi = score >= hi && score > 0;
      const msg = isHi
        ? hiMsgs[Math.floor(Math.random() * hiMsgs.length)]
        : deathMsgs[Math.floor(Math.random() * deathMsgs.length)];

      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <h1>${isHi ? '🏆 ¡RÉCORD!' : '💥 GAME OVER'}</h1>
        <p>Puntos: <strong style="color:#ffff00">${score}</strong></p>
        <p>Nivel: <strong style="color:#ff4444">${level}</strong></p>
        <p>Récord: <strong style="color:#ffff00">${hi}</strong></p>
        <p style="color:#66ddff; margin-top:8px; font-style:italic; font-family:sans-serif; font-size:13px; max-width:90%; line-height:1.5">${msg}</p>
        <button id="restart-btn">Dale de nuevo</button>
        <p style="font-size:7px; color:#555; margin-top:6px">Tocá o presioná cualquier tecla</p>
      `;
      document.getElementById('restart-btn').addEventListener('click', restart);
      overlay.addEventListener('click', (e) => { if (!e.target.closest('button')) restart(); });
      window.addEventListener('keydown', restartKey);
    }

    function restartKey(e) { if (state === 'gameover') restart(); }
    function restart() {
      window.removeEventListener('keydown', restartKey);
      init();
      raf();
    }

    function raf() {
      if (state !== 'playing') return;
      update();
      draw();
      requestAnimationFrame(raf);
    }

    // --- Controls: always moving, input flips direction ---
    window.addEventListener('keydown', e => {
      if (state !== 'playing') return;
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { player.dir = -1; e.preventDefault(); }
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { player.dir = 1; e.preventDefault(); }
    });

    canvas.addEventListener('touchstart', e => {
      e.preventDefault();
      if (state !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const tx = e.touches[0].clientX - rect.left;
      player.dir = tx < rect.width / 2 ? -1 : 1;
    }, { passive: false });
    canvas.addEventListener('touchmove', e => { e.preventDefault(); }, { passive: false });

    canvas.addEventListener('click', e => {
      if (state !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      player.dir = (e.clientX - rect.left) < rect.width / 2 ? -1 : 1;
    });

    const _origUpdate = update;
    update = function() {
      if (state === 'playing') {
        const spd = 3.5 + level * 0.3;
        player.x += player.dir * spd;
        if (player.x <= player.w / 2) { player.x = player.w / 2; player.dir = 1; }
        if (player.x >= W - player.w / 2) { player.x = W - player.w / 2; player.dir = -1; }
      }
      _origUpdate();
    };

    document.getElementById('play-btn').addEventListener('click', () => {
      try { getAudio(); } catch (e) {}
      init();
      raf();
    });
  </script>
</body>
</html>
