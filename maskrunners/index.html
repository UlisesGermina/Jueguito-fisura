<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mask Runners</title>
<style>
body { margin:0; overflow:hidden; background:#0f0f0f; font-family:Arial; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let state = "menu"; // menu, game, shop, gameover

let lanes = [canvas.width * 0.25, canvas.width * 0.5, canvas.width * 0.75];
let currentLane = 1;

let coinsTotal = 0;

let masks = {
  normal: { color: "cyan", price: 0 },
  ghost: { color: "violet", price: 50 },
  speed: { color: "yellow", price: 100 }
};

let selectedMask = "normal";

let player = {};
let obstacles = [];
let coins = [];
let speed, score, gameOver;

function initGame() {
  currentLane = 1;
  player = {
    x: lanes[currentLane],
    y: canvas.height - 150,
    size: 35,
    jumping: false,
    velocityY: 0,
    gravity: 0.8
  };
  obstacles = [];
  coins = [];
  speed = 8;
  score = 0;
  gameOver = false;
}

function spawnObstacle() {
  if (state !== "game") return;
  let lane = Math.floor(Math.random() * 3);
  obstacles.push({ x: lanes[lane], y: -40, size: 40 });
}
setInterval(spawnObstacle, 1200);

function spawnCoin() {
  if (state !== "game") return;
  let lane = Math.floor(Math.random() * 3);
  coins.push({ x: lanes[lane], y: -40, size: 20 });
}
setInterval(spawnCoin, 800);

function jump() {
  if (!player.jumping) {
    player.jumping = true;
    player.velocityY = -15;
  }
}

function switchLane(dir) {
  currentLane += dir;
  if (currentLane < 0) currentLane = 0;
  if (currentLane > 2) currentLane = 2;
  player.x = lanes[currentLane];
}

canvas.addEventListener("touchstart", (e) => {
  let x = e.touches[0].clientX;

  if (state === "menu") {
    state = "game";
    initGame();
  } else if (state === "game") {
    if (x < canvas.width / 3) switchLane(-1);
    else if (x > canvas.width * 2 / 3) switchLane(1);
    else jump();
  } else if (state === "gameover") {
    state = "menu";
  }
});

function update() {
  if (state !== "game") return;

  score++;
  speed += 0.002;

  if (player.jumping) {
    player.y += player.velocityY;
    player.velocityY += player.gravity;
    if (player.y >= canvas.height - 150) {
      player.y = canvas.height - 150;
      player.jumping = false;
    }
  }

  obstacles.forEach((o, i) => {
    o.y += speed;
    if (Math.abs(o.x - player.x) < 30 && Math.abs(o.y - player.y) < 40) {
      gameOver = true;
      state = "gameover";
      coinsTotal += score / 10;
    }
    if (o.y > canvas.height) obstacles.splice(i, 1);
  });

  coins.forEach((c, i) => {
    c.y += speed;
    if (Math.abs(c.x - player.x) < 30 && Math.abs(c.y - player.y) < 40) {
      coinsTotal += 1;
      coins.splice(i, 1);
    }
    if (c.y > canvas.height) coins.splice(i, 1);
  });
}

function drawBackground() {
  ctx.fillStyle = "#141414";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = "#222";
  ctx.lineWidth = 4;
  lanes.forEach((l) => {
    ctx.beginPath();
    ctx.moveTo(l, 0);
    ctx.lineTo(l, canvas.height);
    ctx.stroke();
  });
}

function drawPlayer() {
  ctx.fillStyle = masks[selectedMask].color;
  ctx.shadowBlur = 20;
  ctx.shadowColor = masks[selectedMask].color;
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

function drawGame() {
  drawBackground();

  drawPlayer();

  ctx.fillStyle = "red";
  obstacles.forEach((o) => {
    ctx.fillRect(o.x - 20, o.y - 20, 40, 40);
  });

  ctx.fillStyle = "gold";
  coins.forEach((c) => {
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.fillStyle = "white";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + Math.floor(score), 20, 40);
  ctx.fillText("Coins: " + Math.floor(coinsTotal), 20, 70);
}

function drawMenu() {
  ctx.fillStyle = "#0f0f0f";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "50px Arial";
  ctx.textAlign = "center";
  ctx.fillText("MASK RUNNERS", canvas.width / 2, canvas.height / 3);

  ctx.font = "20px Arial";
  ctx.fillText("Tap to Start", canvas.width / 2, canvas.height / 2);

  ctx.font = "18px Arial";
  ctx.fillText("Coins: " + Math.floor(coinsTotal), canvas.width / 2, canvas.height / 2 + 50);
}

function drawGameOver() {
  drawGame();
  ctx.fillStyle = "rgba(0,0,0,0.7)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = "white";
  ctx.font = "40px Arial";
  ctx.textAlign = "center";
  ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2);

  ctx.font = "20px Arial";
  ctx.fillText("Tap to return", canvas.width / 2, canvas.height / 2 + 40);
}

function loop() {
  update();
  if (state === "menu") drawMenu();
  if (state === "game") drawGame();
  if (state === "gameover") drawGameOver();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
