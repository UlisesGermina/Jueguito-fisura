<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Down Shooter Mobile</title>
<style>
body { margin:0; overflow:hidden; background:black; touch-action:none; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

let player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    size: 20,
    speed: 5
};

let bullets = [];
let enemies = [];
let joystick = { active: false, startX: 0, startY: 0, dx: 0, dy: 0 };

function spawnEnemy() {
    enemies.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 20,
        speed: 1.5
    });
}
setInterval(spawnEnemy, 1000);

function shoot(tx, ty) {
    let angle = Math.atan2(ty - player.y, tx - player.x);
    bullets.push({
        x: player.x,
        y: player.y,
        dx: Math.cos(angle) * 10,
        dy: Math.sin(angle) * 10,
        size: 6
    });
}

canvas.addEventListener("touchstart", (e) => {
    let touch = e.touches[0];
    if (touch.clientX < canvas.width / 2) {
        joystick.active = true;
        joystick.startX = touch.clientX;
        joystick.startY = touch.clientY;
    } else {
        shoot(touch.clientX, touch.clientY);
    }
});

canvas.addEventListener("touchmove", (e) => {
    if (joystick.active) {
        let touch = e.touches[0];
        joystick.dx = touch.clientX - joystick.startX;
        joystick.dy = touch.clientY - joystick.startY;
    }
});

canvas.addEventListener("touchend", () => {
    joystick.active = false;
    joystick.dx = 0;
    joystick.dy = 0;
});

function update() {
    if (joystick.active) {
        let mag = Math.sqrt(joystick.dx * joystick.dx + joystick.dy * joystick.dy);
        if (mag > 10) {
            player.x += (joystick.dx / mag) * player.speed;
            player.y += (joystick.dy / mag) * player.speed;
        }
    }

    bullets.forEach((b) => {
        b.x += b.dx;
        b.y += b.dy;
    });

    enemies.forEach((e) => {
        let angle = Math.atan2(player.y - e.y, player.x - e.x);
        e.x += Math.cos(angle) * e.speed;
        e.y += Math.sin(angle) * e.speed;
    });

    bullets.forEach((b, bi) => {
        enemies.forEach((e, ei) => {
            let dist = Math.hypot(b.x - e.x, b.y - e.y);
            if (dist < e.size) {
                enemies.splice(ei, 1);
                bullets.splice(bi, 1);
            }
        });
    });
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "cyan";
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "yellow";
    bullets.forEach((b) => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.fillStyle = "red";
    enemies.forEach((e) => {
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
